# 소스 압축 파일(obbangmo-source.zip)을 풀어 빌드하고 GitHub Pages에 배포한다.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack source
        run: |
          mkdir app
          unzip -q obbangmo-source.zip -d app
      - name: Set GitHub Pages base path
        working-directory: app
        run: |
          node - <<'JS'
          const fs = require('fs');
          const edit = (f, a, b) => { const s = fs.readFileSync(f, 'utf8'); if (!s.includes(a)) { if (s.includes(b)) return; throw new Error('patch target missing: ' + f); } fs.writeFileSync(f, s.replace(a, b)); };
          edit('src/main.tsx', '<BrowserRouter>', "<BrowserRouter basename={import.meta.env.BASE_URL.replace(/\\/$/, '')}>");
          edit('src/pages/Checkout.tsx', 'const origin = window.location.origin;', "const origin = window.location.origin + import.meta.env.BASE_URL.replace(/\\/$/, '');");
          JS
      - name: Install and build
        working-directory: app
        env:
          # 공개용 키(publishable)만 사용한다. 비밀 키는 넣지 않는다.
          VITE_SUPABASE_URL: https://pnbfejnrrabnrbjyplfo.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_E4FkXbPUr9gCdwt-eCsFIQ_H6UndU3c
        run: |
          npm ci
          npx vite build --base /obbangmo/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
